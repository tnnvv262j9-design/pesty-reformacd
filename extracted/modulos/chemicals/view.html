<div class="view-header">
    <h2 class="view-title">Inventario de <span class="highlight">Químicos</span></h2>
    <button class="cta-button" id="btn-add-chemical-inv" onclick="openChemicalModal()">➕ Agregar Químico</button>
</div>

<style>
    .action-btn {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-right: 5px;
        color: white;
        text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .action-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .btn-stock {
        background: linear-gradient(135deg, #10B981, #059669); /* Green */
    }
    .btn-edit {
        background: linear-gradient(135deg, #3B82F6, #2563EB); /* Blue */
    }
    .btn-delete {
        background: linear-gradient(135deg, #EF4444, #DC2626); /* Red */
    }
    .btn-fichas {
        background: linear-gradient(135deg, #8B5CF6, #7C3AED); /* Purple */
    }
    .btn-methods {
        background: linear-gradient(135deg, #F59E0B, #D97706); /* Amber */
    }
    .action-group {
        display: flex;
        gap: 5px;
        justify-content: center;
    }
    
    /* Type Selection Styles */
    .type-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 15px;
        margin-top: 20px;
    }
    .type-card {
        background: var(--bg-card);
        border: 2px solid var(--border-color);
        border-radius: 12px;
        padding: 20px 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }
    .type-card:hover {
        border-color: var(--accent-primary);
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .type-card .icon {
        font-size: 2rem;
    }
    .type-card .label {
        font-weight: 600;
        color: var(--text-primary);
    }
</style>

<div class="toolbar">
    <input type="text" id="chemical-search" placeholder="Buscar por nombre..." style="flex-grow: 2;">
</div>
<div class="table-wrapper" style="margin-top: 20px;">
    <table class="data-table" id="chemicals-table">
        <thead>
            <!-- Generated by JS -->
        </thead>
        <tbody>
            <!-- Loaded via JS -->
        </tbody>
    </table>
</div>

<!-- Add/Edit Chemical Modal -->
<div id="chemical-modal" class="modal no-print">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal('chemical-modal')">×</span>
        <h2 id="chemical-modal-title"></h2>
        
        <!-- Step 1: Type Selection -->
        <div id="chemical-type-selection" style="display:none;">
            <p style="text-align: center; color: var(--text-secondary);">Seleccione el tipo de producto para configurar las unidades correctamente.</p>
            <div class="type-grid">
                <div class="type-card" onclick="selectChemicalType('liquid')">
                    <div class="icon">💧</div>
                    <div class="label">Líquido</div>
                </div>
                <div class="type-card" onclick="selectChemicalType('powder')">
                    <div class="icon">🍚</div>
                    <div class="label">Polvo</div>
                </div>
                 <div class="type-card" onclick="selectChemicalType('gel')">
                    <div class="icon">🧴</div>
                    <div class="label">Gel</div>
                </div>
                <div class="type-card" onclick="selectChemicalType('trap')">
                    <div class="icon">🪤</div>
                    <div class="label">Trampa/Cebo</div>
                </div>
                 <div class="type-card" onclick="selectChemicalType('other')">
                    <div class="icon">📦</div>
                    <div class="label">Otro</div>
                </div>
            </div>
        </div>

        <!-- Step 2: Data Form -->
        <form id="chemical-form" style="display:none;">
            <input type="hidden" id="chemical-id">
            <input type="hidden" id="chemical-type">
            <input type="hidden" id="chemical-unit">
            
            <div class="form-grid">
                <div class="form-group full-width" style="display: flex; justify-content: flex-end;">
                    <button type="button" class="cta-button" id="btn-scan-label" onclick="triggerChemicalLabelScan()" style="background: #1D4ED8;">📷 Escanear etiqueta</button>
                </div>
            </div>
            <input type="file" id="chemical-label-input" accept="image/*" capture="environment" style="display:none;">
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="chemical-name">Nombre del Producto</label>
                    <input type="text" id="chemical-name" required>
                </div>
                <div class="form-group" id="group-concentration">
                    <label for="chemical-concentration">Concentración</label>
                    <input type="text" id="chemical-concentration" placeholder="Ej: 5%">
                </div>
            </div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="chemical-rsco">Registro Sanitario (RSCO)</label>
                    <input type="text" id="chemical-rsco" placeholder="Ej: RSCO-URB-INAC-111-14-09-12">
                </div>
                <div class="form-group">
                    <label for="chemical-active-ingredient">Ingrediente Activo</label>
                    <input type="text" id="chemical-active-ingredient" placeholder="Ej: Cipermetrina">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="chemical-batch-number">Número de Lote</label>
                    <input type="text" id="chemical-batch-number">
                </div>
                <div class="form-group">
                    <label for="chemical-expiration-date">Fecha de Caducidad</label>
                    <input type="date" id="chemical-expiration-date">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="chemical-quantity" id="label-quantity">Cantidad Comprada</label>
                    <input type="number" id="chemical-quantity" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="chemical-price">Precio Total ($)</label>
                    <input type="number" id="chemical-price" step="0.01" required>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="chemical-min-stock" id="label-min-stock">Stock Mínimo</label>
                    <input type="number" id="chemical-min-stock" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label id="label-cost-calculated">Costo calculado</label>
                    <input type="text" id="chemical-cost-calculated" readonly style="background-color: #f0f0f0;">
                </div>
            </div>
            
            <div class="form-actions" style="margin-top: 20px; display: flex; justify-content: space-between; gap: 10px;">
                <button type="button" class="secondary-btn" id="btn-back-type" onclick="resetToTypeSelection()" style="display:none;">🔙 Volver</button>
                <button type="submit" class="cta-button" style="flex-grow: 1;">Guardar Producto</button>
            </div>
        </form>
    </div>
</div>

<!-- Documents Modal -->
<div id="documents-modal" class="modal no-print">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal('documents-modal')">×</span>
        <h2 id="documents-modal-title">Gestión de Documentos</h2>
        
        <div class="upload-section" style="margin-bottom: 20px; padding: 15px; background: var(--bg-secondary); border-radius: 8px;">
            <h3>Subir Nuevo Documento</h3>
            <form id="upload-document-form">
                <input type="hidden" id="doc-chemical-id" name="chemical_id">
                <input type="hidden" id="doc-type" name="type">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="doc-file">Seleccionar Archivo (PDF, Imagen, Word)</label>
                        <input type="file" id="doc-file" name="file" required accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" style="padding: 10px; border: 1px dashed var(--border-color); width: 100%;">
                    </div>
                </div>
                <button type="button" class="cta-button" style="width: 100%; margin-top: 10px;" onclick="submitChemicalDocument()">⬆️ Subir Archivo</button>
            </form>
        </div>

        <div class="documents-list-section">
            <h3>Documentos Existentes</h3>
            <div id="documents-list" style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                <!-- List populated by JS -->
                <p style="text-align: center; color: var(--text-secondary);">Cargando documentos...</p>
            </div>
        </div>
    </div>
</div>

<!-- Add Stock Modal -->
<div id="stock-modal" class="modal no-print">
    <div class="modal-content" style="max-width: 400px;">
        <span class="modal-close" onclick="closeModal('stock-modal')">×</span>
        <h2>Añadir Stock</h2>
        <form id="stock-form">
            <input type="hidden" id="stock-chemical-id">
            <h3 id="stock-chemical-name" style="margin-bottom: 20px; color: var(--accent-primary);"></h3>
            <div class="form-group full-width">
                <label for="stock-amount">Cantidad a añadir (ml)</label>
                <input type="number" id="stock-amount" step="0.01" required>
            </div>
            <div class="form-group full-width">
                <label for="stock-cost">Costo ($)</label>
                <input type="number" id="stock-cost" step="0.01" placeholder="Costo de la cantidad ingresada">
            </div>
            <div class="form-group full-width">
                <label for="stock-batch-number">Número de Lote ⚠️</label>
                <input type="text" id="stock-batch-number" required placeholder="Código impreso en la botella">
            </div>
            <div class="form-group full-width">
                <label for="stock-expiration-date">Fecha de Caducidad ⚠️</label>
                <input type="date" id="stock-expiration-date" required>
            </div>
            <button type="submit" class="cta-button" style="width:100%; margin-top: 20px;">Añadir Stock</button>
        </form>
    </div>
</div>
